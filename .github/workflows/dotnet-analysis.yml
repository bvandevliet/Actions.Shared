name: Dotnet analysis

on:
  workflow_call:
    inputs:
      DOTNET_VERSION:
        type: string
        default: "10"
        description: The version of the dotnet SDK, see https://github.com/actions/setup-dotnet/tree/v4/#supported-version-syntax.
      skipTrivyScan:
        type: boolean
        default: false
        description: Set to false to skip the Trivy vulnerability scan.

jobs:
  analysis:
    name: Run code analysis and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: ${{ github.sha }}
      - name: Initialize CodeQL
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - name: Perform CodeQL analysis
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.DOTNET_VERSION }}
      - name: Resolve solution file
        id: solution
        shell: bash
        run: |
          # Bare `dotnet restore`/`test` search the root for *.sln|*.slnx AND *.*proj;
          # a root-level project file with a different base name than the solution
          # (e.g. docker-compose.dcproj) trips MSB1011. Resolve the solution
          # explicitly so that stray project file is never in the running.
          shopt -s nullglob
          files=(*.slnx *.sln)
          echo "path=${files[0]:-}" >> "$GITHUB_OUTPUT"
      - name: Restore NuGet packages
        run: dotnet restore ${{ steps.solution.outputs.path }}
      - name: Generate Trivy vulnerability report
        if: inputs.skipTrivyScan != true && github.actor != 'dependabot[bot]'
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-fs.sarif"
          exit-code: 0
      - name: Upload Trivy scan results
        if: inputs.skipTrivyScan != true && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-fs.sarif"
      - name: Run all tests
        run: dotnet test ${{ steps.solution.outputs.path }} --no-restore --verbosity normal --logger trx
